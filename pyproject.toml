[project]
name = "webciclo"
version = "0.1.0"
description = "WebCiclo Project"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "Flask==2.3.3",
    "Flask-WTF==1.2.1",
    "WTForms==3.1.1",
    "Werkzeug==2.3.7",
    "Jinja2==3.1.2",
    "MarkupSafe==2.1.3",
    "Itsdangerous==2.1.2",
    "Click==8.1.7",
    "Blinker==1.6.3",
    "reportlab==4.4.3",
    "google-generativeai==0.8.3",
    "python-dotenv==1.0.1",
    "Pillow==10.4.0",
    "bcrypt==4.1.2",
    "pymysql==1.1.0",
    "email-validator==2.3.0",
    "alembic>=1.18.3",
    "sqlalchemy>=2.0.46",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
# python-version removed as it caused parse error


[tool.hatch.build.targets.wheel]
packages = ["services", "repositories", "scripts"]
